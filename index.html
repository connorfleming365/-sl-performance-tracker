<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>S&L Corby RFC — Performance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* S&L Corby RFC Design System */
    --color-ink: #0B0B0C;
    --color-ink-mid: #171716;
    --color-chalk: #F5F1E6;
    --color-chalk-dim: #A79E8E;
    --color-gold: #E9B341;
    --color-gold-light: #F7D58F;
    --color-red: #C4393C;
    --line: rgba(245,241,230,0.10);
    --font-display: 'Oswald', 'Arial Narrow', Helvetica, sans-serif;
    --font-body: 'Barlow', 'Segoe UI', Helvetica, Arial, sans-serif;
    --radius-sm: 3px;
    --radius-md: 6px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--color-ink);
    color:var(--color-chalk);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1000px;margin:0 auto;padding:var(--space-8) var(--space-5) 60px;}

  .masthead{
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:3px solid var(--color-gold);
    padding-bottom:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap;gap:var(--space-4);
  }
  .masthead .brand{display:flex;align-items:center;gap:var(--space-4);}
  .masthead .crest{height:64px;width:auto;display:block;}
  .masthead h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:30px;
    letter-spacing:0.5px;
    margin:0;
    text-transform:uppercase;
    line-height:1.1;
  }
  .masthead .season{color:var(--color-gold);font-size:13px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;}
  .masthead a.logbtn{
    color:var(--color-ink);background:var(--color-gold);padding:9px 16px;border-radius:var(--radius-sm);
    text-decoration:none;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
    font-family:var(--font-display);
  }

  .tabs{display:flex;gap:var(--space-2);margin-bottom:var(--space-5);}
  .tab-btn{
    flex:1;padding:13px 10px;background:var(--color-ink-mid);border:1px solid var(--line);color:var(--color-chalk);
    font-family:var(--font-display);font-size:15px;font-weight:600;cursor:pointer;
    text-transform:uppercase;letter-spacing:0.4px;border-radius:var(--radius-sm);
  }
  .tab-btn.active{background:var(--color-gold);color:var(--color-ink);border-color:var(--color-gold);}

  .scoreboard{
    display:grid;grid-template-columns:repeat(7,1fr);
    border:1px solid var(--line);border-radius:var(--radius-md);overflow:hidden;margin-bottom:var(--space-3);
  }
  .stat{padding:var(--space-4) var(--space-1);text-align:center;border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat .num{font-size:27px;font-weight:700;font-family:var(--font-display);}
  .stat .lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:var(--color-chalk-dim);margin-top:3px;}
  .stat.diffpos .num{color:var(--color-gold);} .stat.diffneg .num{color:var(--color-red);}

  .form-guide{display:flex;gap:6px;align-items:center;margin-bottom:var(--space-6);font-size:12px;color:var(--color-chalk-dim);flex-wrap:wrap;}
  .form-guide .chip{
    width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-weight:700;font-size:12px;color:var(--color-ink);
  }
  .chip.W{background:var(--color-gold);} .chip.D{background:#8C7B57;} .chip.L{background:var(--color-red);}

  section{margin-bottom:var(--space-8);}
  h2{
    font-family:var(--font-display);
    font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--color-gold);
    border-bottom:1px solid var(--line);padding-bottom:var(--space-2);margin-bottom:var(--space-4);font-weight:600;
  }

  .match{border:1px solid var(--line);border-radius:var(--radius-md);margin-bottom:var(--space-2);}
  .match-head{display:flex;justify-content:space-between;align-items:center;padding:var(--space-3) var(--space-4);cursor:pointer;}
  .match-head .res{
    display:inline-block;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;
    font-weight:700;font-size:12px;color:var(--color-ink);margin-right:var(--space-2);
  }
  .res.W{background:var(--color-gold);} .res.D{background:#8C7B57;} .res.L{background:var(--color-red);}
  .match-title{font-weight:600;font-size:14px;}
  .team-tag{
    display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;
    color:var(--color-ink);background:var(--color-chalk-dim);border-radius:2px;padding:1px 6px;margin-left:6px;
    vertical-align:middle;
  }
  .match-sub{font-size:11px;color:var(--color-chalk-dim);margin-top:2px;}
  .match-score{font-family:var(--font-display);font-size:20px;font-weight:700;}
  .match-body{display:none;padding:0 var(--space-4) var(--space-4);border-top:1px solid var(--line);}
  .match-body.open{display:block;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:var(--space-3);}
  th{text-align:left;color:var(--color-chalk-dim);font-size:10px;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--line);letter-spacing:0.4px;}
  td{padding:7px 4px;border-bottom:1px solid rgba(245,241,230,0.05);}
  .empty{color:var(--color-chalk-dim);font-size:13px;padding:var(--space-4) 0;}
  .lb-controls{margin-bottom:var(--space-3);}
  input{
    width:100%;padding:9px 10px;background:var(--color-ink-mid);border:1px solid var(--line);color:var(--color-chalk);
    font-size:14px;border-radius:var(--radius-sm);font-family:var(--font-body);
  }
  .pom-tag{color:var(--color-gold);font-weight:700;}
  .card-badge{display:inline-block;width:12px;height:16px;border-radius:2px;vertical-align:middle;margin-left:4px;}
  .card-badge.yellow{background:var(--color-gold-light);} .card-badge.red{background:var(--color-red);}
  svg{width:100%;height:150px;display:block;}
  .chart-wrap{border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-4);}
  .axis-lbl{font-size:9px;fill:var(--color-chalk-dim);}
  .loading{color:var(--color-chalk-dim);font-size:13px;}
  @media(max-width:640px){
    .scoreboard{grid-template-columns:repeat(4,1fr);}
    .stat{border-bottom:1px solid var(--line);}
    .masthead h1{font-size:22px;}
    .masthead .crest{height:48px;}
  }
</style>
</head>

<script>
let currentTeam = 'overall';
let matches = { '1st-xv': [], 'dev-xv': [] };

const TEAM_LABEL = { '1st-xv': '1st XV', 'dev-xv': 'Dev XV' };

function result(m){ if(m.scoreFor > m.scoreAgainst) return 'W'; if(m.scoreFor < m.scoreAgainst) return 'L'; return 'D'; }

function getMatches(){
  if(currentTeam === 'overall'){
    return [
      ...matches['1st-xv'].map(m => ({...m, _team:'1st-xv'})),
      ...matches['dev-xv'].map(m => ({...m, _team:'dev-xv'}))
    ];
  }
  return matches[currentTeam].map(m => ({...m, _team: currentTeam}));
}

function renderScoreboard(){
  const list = getMatches();
  const played = list.length;
  const won = list.filter(m=>result(m)==='W').length;
  const drawn = list.filter(m=>result(m)==='D').length;
  const lost = list.filter(m=>result(m)==='L').length;
  const pf = list.reduce((s,m)=>s+Number(m.scoreFor),0);
  const pa = list.reduce((s,m)=>s+Number(m.scoreAgainst),0);
  const diff = pf-pa;
  const stats = [['P',played],['W',won],['D',drawn],['L',lost],['PF',pf],['PA',pa],['DIFF',(diff>0?'+':'')+diff]];
  document.getElementById('scoreboard').innerHTML = stats.map(([lbl,num])=>{
    let cls='stat'; if(lbl==='DIFF') cls += diff>0?' diffpos':(diff<0?' diffneg':'');
    return `<div class="${cls}"><div class="num">${num}</div><div class="lbl">${lbl}</div></div>`;
  }).join('');
  const sorted = [...list].sort((a,b)=>a.date.localeCompare(b.date));
  const last5 = sorted.slice(-5);
  document.getElementById('formGuide').innerHTML = last5.length===0
    ? '<span>No matches logged yet this season.</span>'
    : 'Form: ' + last5.map(m=>`<span class="chip ${result(m)}">${result(m)}</span>`).join('');
}

function renderMatchLog(){
  const list = [...getMatches()].sort((a,b)=>b.date.localeCompare(a.date));
  const container = document.getElementById('matchLog');
  if(list.length===0){ container.innerHTML = '<div class="empty">No matches logged yet.</div>'; return; }
  container.innerHTML = list.map(m=>{
    const r = result(m);
    const dateStr = m.date ? new Date(m.date+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
    const rows = m.playerRatings.length ? m.playerRatings.map(p=>
      `<tr><td>${p.player}${p.pom?' <span class="pom-tag">POM</span>':''}${p.card&&p.card!=='none'?` <span class="card-badge ${p.card}" title="${p.card} card"></span>`:''}</td><td>${p.points||0}</td><td>${p.tries}</td></tr>`
    ).join('') : '<tr><td colspan="3" class="empty">No player entries logged.</td></tr>';
    const pomPlayer = m.playerRatings.find(p=>p.pom);
    const teamTag = currentTeam === 'overall' ? `<span class="team-tag">${TEAM_LABEL[m._team]}</span>` : '';
    return `<div class="match">
      <div class="match-head" onclick="toggleMatch('${m.id}')">
        <div>
          <span class="res ${r}">${r}</span>
          <span class="match-title">${m.opponent}</span>${teamTag}
          <div class="match-sub">${dateStr} &middot; ${m.venue} &middot; ${m.comp}${pomPlayer?` &middot; <span class="pom-tag">POM ${pomPlayer.player}</span>`:''}</div>
        </div>
        <div class="match-score">${m.scoreFor} - ${m.scoreAgainst}</div>
      </div>
      <div class="match-body" id="body-${m.id}">
        ${m.notes ? `<div style="font-size:13px;color:var(--color-chalk-dim);margin-top:10px;">${m.notes}</div>` : ''}
        <table><thead><tr><th>Player</th><th>Points</th><th>Tries</th></tr></thead><tbody>${rows}</tbody></table>
      </div>
    </div>`;
  }).join('');
}
function toggleMatch(id){ document.getElementById('body-'+id).classList.toggle('open'); }

function computePlayerStats(){
  const stats = {};
  getMatches().forEach(m=>m.playerRatings.forEach(p=>{
    if(!stats[p.player]) stats[p.player] = {apps:0,points:0,tries:0,cards:0,pom:0};
    stats[p.player].apps++; stats[p.player].points += (p.points||0); stats[p.player].tries += p.tries;
    if(p.card && p.card!=='none') stats[p.player].cards++;
    if(p.pom) stats[p.player].pom++;
  }));
  return stats;
}

function renderLeaderboard(filter=''){
  const heading = currentTeam === 'overall' ? 'Player Appearances — Overall'
    : 'Player Appearances — ' + TEAM_LABEL[currentTeam];
  document.getElementById('lbHeading').textContent = heading;
  const stats = computePlayerStats();
  let rows = Object.entries(stats).map(([name,s])=>({name, ...s}));
  rows.sort((a,b)=> b.pom-a.pom || b.points-a.points || b.apps-a.apps);
  if(filter) rows = rows.filter(r=>r.name.toLowerCase().includes(filter.toLowerCase()));
  const body = document.getElementById('lbBody');
  body.innerHTML = rows.length===0 ? '<tr><td colspan="6" class="empty">No player data yet.</td></tr>' :
    rows.map(r=>`<tr><td>${r.name}</td><td>${r.apps}</td><td>${r.points}</td><td>${r.tries}</td><td>${r.cards}</td><td>${r.pom}</td></tr>`).join('');
}

function renderChart(){
  const list = [...getMatches()].sort((a,b)=>a.date.localeCompare(b.date));
  const svg = document.getElementById('trendChart');
  const w=700,h=150,pad=30;
  if(list.length<1){ svg.innerHTML = `<text x="20" y="75" fill="#A79E8E" font-size="13">No matches logged yet.</text>`; return; }
  const diffs = list.map(m=>m.scoreFor - m.scoreAgainst);
  const maxAbs = Math.max(10, ...diffs.map(d=>Math.abs(d)));
  const yZero = h/2;
  const stepX = list.length>1 ? (w-2*pad)/(list.length-1) : 0;
  const scaleY = (h/2-15)/maxAbs;
  const points = diffs.map((d,i)=>[pad+i*stepX, yZero-d*scaleY]);
  const pathD = points.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const dots = points.map((p,i)=>{
    const col = diffs[i]>0?'#E9B341':(diffs[i]<0?'#C4393C':'#8C7B57');
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${col}"><title>${list[i].opponent}: ${diffs[i]>0?'+':''}${diffs[i]}</title></circle>`;
  }).join('');
  svg.innerHTML = `<line x1="${pad}" y1="${yZero}" x2="${w-pad}" y2="${yZero}" stroke="rgba(245,241,230,0.15)" stroke-width="1"/><path d="${pathD}" fill="none" stroke="#E9B341" stroke-width="2"/>${dots}<text class="axis-lbl" x="${pad}" y="${yZero-4}">0</text>`;
}

function renderPomLeader(){
  const counts = {};
  getMatches().forEach(m=>m.playerRatings.forEach(p=>{ if(p.pom) counts[p.player] = (counts[p.player]||0)+1; }));
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const el = document.getElementById('pomLeader');
  if(entries.length===0){ el.innerHTML=''; return; }
  const top = entries[0][1];
  const leaders = entries.filter(([,c])=>c===top).map(([n])=>n);
  el.innerHTML = `<span class="pom-tag">Player of the Season:</span> ${leaders.join(', ')} (${top} MOTM${top>1?'s':''})`;
}

function renderTopStats(){
  const stats = computePlayerStats();
  const entries = Object.entries(stats);

  const triesEl = document.getElementById('topTries');
  const tryEntries = entries.filter(([,s])=>s.tries>0).sort((a,b)=>b[1].tries-a[1].tries);
  if(tryEntries.length===0){ triesEl.innerHTML=''; }
  else{
    const top = tryEntries[0][1].tries;
    const leaders = tryEntries.filter(([,s])=>s.tries===top).map(([n])=>n);
    triesEl.innerHTML = `<span class="pom-tag">Top Try Scorer:</span> ${leaders.join(', ')} (${top} tr${top>1?'ies':'y'})`;
  }

  const appsEl = document.getElementById('topApps');
  const appEntries = entries.filter(([,s])=>s.apps>0).sort((a,b)=>b[1].apps-a[1].apps);
  if(appEntries.length===0){ appsEl.innerHTML=''; }
  else{
    const top = appEntries[0][1].apps;
    const leaders = appEntries.filter(([,s])=>s.apps===top).map(([n])=>n);
    appsEl.innerHTML = `<span class="pom-tag">Most Appearances:</span> ${leaders.join(', ')} (${top} app${top>1?'s':''})`;
  }
}

function renderAll(){
  renderScoreboard(); renderMatchLog();
  renderLeaderboard(document.getElementById('playerSearch').value);
  renderChart(); renderPomLeader(); renderTopStats();
}

async function loadData(){
  try{
    const res = await fetch('/api/matches');
    const data = await res.json();
    matches['1st-xv'] = data['1st-xv'] || [];
    matches['dev-xv'] = data['dev-xv'] || [];
  }catch(e){
    console.error('Failed to load data', e);
  }
  document.getElementById('loadingMsg').style.display = 'none';
  renderAll();
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTeam = btn.dataset.team;
    renderAll();
  });
});
document.getElementById('playerSearch').addEventListener('input', (e)=>renderLeaderboard(e.target.value));

loadData();
</script>
</body>
</html>
