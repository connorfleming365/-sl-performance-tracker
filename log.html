<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>S&L Corby RFC — Log a Match</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --color-ink: #0B0B0C;
    --color-ink-mid: #171716;
    --color-chalk: #F5F1E6;
    --color-chalk-dim: #A79E8E;
    --color-gold: #E9B341;
    --color-gold-light: #F7D58F;
    --color-red: #C4393C;
    --line: rgba(245,241,230,0.10);
    --font-display: 'Oswald', 'Arial Narrow', Helvetica, sans-serif;
    --font-body: 'Barlow', 'Segoe UI', Helvetica, Arial, sans-serif;
    --radius-sm: 3px;
    --radius-md: 6px;
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--color-ink);color:var(--color-chalk);font-family:var(--font-body);-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1000px;margin:0 auto;padding:var(--space-8) var(--space-5) 60px;}
  .masthead{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--color-gold);padding-bottom:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap;gap:var(--space-4);}
  .masthead .brand{display:flex;align-items:center;gap:var(--space-4);}
  .masthead .crest{height:56px;width:auto;display:block;}
  .masthead h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:0.5px;margin:0;text-transform:uppercase;}
  .masthead a{color:var(--color-gold);font-size:13px;text-decoration:none;font-family:var(--font-body);}
  .masthead-right{display:flex;align-items:center;gap:var(--space-3);}
  .forged-inline{height:34px;width:auto;display:block;}
  .tabs{display:flex;gap:var(--space-2);margin-bottom:var(--space-5);}
  .tab-btn{
    flex:1;padding:13px 10px;background:var(--color-ink-mid);border:1px solid var(--line);color:var(--color-chalk);
    font-family:var(--font-display);font-size:15px;font-weight:600;cursor:pointer;
    text-transform:uppercase;letter-spacing:0.4px;border-radius:var(--radius-sm);
  }
  .tab-btn.active{background:var(--color-gold);color:var(--color-ink);border-color:var(--color-gold);}
  section{margin-bottom:var(--space-8);}
  h2{font-family:var(--font-display);font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--color-gold);border-bottom:1px solid var(--line);padding-bottom:var(--space-2);margin-bottom:var(--space-4);font-weight:600;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-3);}
  label{font-size:11px;color:var(--color-chalk-dim);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:0.4px;}
  input,select,textarea{
    width:100%;padding:9px 10px;background:var(--color-ink-mid);border:1px solid var(--line);color:var(--color-chalk);
    font-size:14px;border-radius:var(--radius-sm);margin-bottom:var(--space-3);font-family:var(--font-body);
  }
  input:focus,select:focus,textarea:focus{outline:1px solid var(--color-gold);}
  .field{margin-bottom:0;}
  .rating-row{display:grid;grid-template-columns:26px 1.5fr 40px 40px 40px 50px 68px 30px;gap:5px;align-items:center;margin-bottom:var(--space-2);}
  .rating-row input,.rating-row select{margin-bottom:0;padding:9px 6px;}
  .rating-row .num{color:var(--color-gold);font-family:var(--font-display);font-weight:700;font-size:14px;text-align:center;}
  .rating-row .pr-points{background:var(--color-ink);color:var(--color-gold);font-weight:700;text-align:center;border-color:var(--line);}
  .small-lbl{font-size:9px;color:var(--color-chalk-dim);text-align:center;text-transform:uppercase;}
  button.primary{
    background:var(--color-gold);color:var(--color-ink);border:none;padding:12px 18px;font-weight:700;
    text-transform:uppercase;letter-spacing:0.4px;font-size:13px;cursor:pointer;border-radius:var(--radius-sm);
    font-family:var(--font-display);
  }
  button.ghost{background:none;border:1px solid var(--line);color:var(--color-chalk);padding:8px 14px;cursor:pointer;border-radius:var(--radius-sm);font-size:12px;text-transform:uppercase;}
  button.link{background:none;border:none;color:var(--color-chalk-dim);cursor:pointer;text-decoration:underline;font-size:12px;padding:0;}
  .match{border:1px solid var(--line);border-radius:var(--radius-md);margin-bottom:var(--space-2);}
  .match-head{display:flex;justify-content:space-between;align-items:center;padding:var(--space-3) var(--space-4);cursor:pointer;}
  .match-head .res{display:inline-block;width:24px;height:24px;border-radius:50%;text-align:center;line-height:24px;font-weight:700;font-size:12px;color:var(--color-ink);margin-right:var(--space-2);}
  .res.W{background:var(--color-gold);} .res.D{background:#8C7B57;} .res.L{background:var(--color-red);}
  .match-title{font-weight:600;font-size:14px;}
  .match-sub{font-size:11px;color:var(--color-chalk-dim);margin-top:2px;}
  .match-score{font-family:var(--font-display);font-size:20px;font-weight:700;}
  .match-body{display:none;padding:0 var(--space-4) var(--space-4);border-top:1px solid var(--line);}
  .match-body.open{display:block;}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:var(--space-3);}
  th{text-align:left;color:var(--color-chalk-dim);font-size:10px;text-transform:uppercase;padding:6px 4px;border-bottom:1px solid var(--line);}
  td{padding:7px 4px;border-bottom:1px solid rgba(245,241,230,0.05);}
  .match-actions{margin-top:var(--space-3);display:flex;gap:var(--space-3);}
  .empty{color:var(--color-chalk-dim);font-size:13px;padding:var(--space-4) 0;}
  .pom-tag{color:var(--color-gold);font-weight:700;}
  .card-badge{display:inline-block;width:12px;height:16px;border-radius:2px;vertical-align:middle;margin-left:4px;}
  .card-badge.yellow{background:var(--color-gold-light);} .card-badge.red{background:var(--color-red);}
  .passcode-bar{background:var(--color-ink-mid);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);margin-bottom:var(--space-5);display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap;}
  .passcode-bar input{margin-bottom:0;max-width:200px;}
  #saveStatus{font-size:12px;color:var(--color-chalk-dim);}
  .squad-actions{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;margin-bottom:var(--space-4);}
  .squad-actions input{max-width:220px;margin-bottom:0;}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;} .rating-row{grid-template-columns:20px 1.3fr 1fr 1fr 1fr 1fr 1.4fr 24px;font-size:11px;} .masthead h1{font-size:20px;} .masthead .crest{height:44px;} .forged-inline{height:24px;}}
</style>
</head>

  </section>
</div>

<datalist id="rosterOptions"></datalist>

<script>
const SQUAD_SIZE = 26;
let ROSTER = [];
let currentTeam = '1st-xv';
let matches = { '1st-xv': [], 'dev-xv': [] };
let editingId = null;

function uid(){ return 'm'+Date.now()+Math.random().toString(16).slice(2,8); }
function result(m){ if(m.scoreFor > m.scoreAgainst) return 'W'; if(m.scoreFor < m.scoreAgainst) return 'L'; return 'D'; }

async function loadData(){
  try{
    const res = await fetch('/api/matches');
    const data = await res.json();
    matches['1st-xv'] = data['1st-xv'] || [];
    matches['dev-xv'] = data['dev-xv'] || [];
    ROSTER = (data.roster || []).slice().sort();
  }catch(e){ console.error(e); }
  buildSquadTable();
}

function renderRosterOptions(){
  document.getElementById('rosterOptions').innerHTML =
    ROSTER.map(p=>`<option value="${p}">`).join('');
}

function buildSquadTable(){
  const container = document.getElementById('playerRows');
  let html = '';
  for(let n=1; n<=SQUAD_SIZE; n++){
    html += `<div class="rating-row" data-num="${n}">
      <div class="num">${n}</div>
      <input type="text" class="pr-name" list="rosterOptions" placeholder="Type name...">
      <input type="number" class="pr-tries" min="0" value="0">
      <input type="number" class="pr-con" min="0" value="0">
      <input type="number" class="pr-pk" min="0" value="0">
      <input type="number" class="pr-points" min="0" value="0" readonly tabindex="-1">
      <select class="pr-card">
        <option value="none">None</option>
        <option value="yellow">Yellow</option>
        <option value="red">Red</option>
      </select>
      <input type="checkbox" class="pr-pom" style="margin:0;width:18px;height:18px;">
    </div>`;
  }
  container.innerHTML = html;
  renderRosterOptions();
  container.querySelectorAll('.pr-tries, .pr-con, .pr-pk').forEach(el=>{
    el.addEventListener('input', ()=>recalcRowPoints(el.closest('.rating-row')));
  });
}

function recalcRowPoints(row){
  const tries = Number(row.querySelector('.pr-tries').value||0);
  const con = Number(row.querySelector('.pr-con').value||0);
  const pk = Number(row.querySelector('.pr-pk').value||0);
  row.querySelector('.pr-points').value = (tries*5) + (con*2) + (pk*3);
}

function addToRosterIfNew(name){
  const trimmed = name.trim();
  if(!trimmed) return;
  if(!ROSTER.some(p=>p.toLowerCase()===trimmed.toLowerCase())){
    ROSTER.push(trimmed);
    ROSTER.sort();
    renderRosterOptions();
  }
}

async function persist(){
  const passcode = document.getElementById('passcode').value;
  const res = await fetch('/api/matches', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ passcode, data: {...matches, roster: ROSTER} })
  });
  if(res.status === 401){
    document.getElementById('saveStatus').textContent = 'Wrong passcode.';
    return false;
  }
  if(!res.ok){
    let msg = 'Save failed — try again.';
    try{ const body = await res.json(); if(body && body.detail) msg = 'Save failed: ' + body.detail; }catch(e){}
    document.getElementById('saveStatus').textContent = msg;
    return false;
  }
  return true;
}

function setSquadRow(num, name='', tries=0, con=0, pk=0, card='none', pom=false){
  const row = document.querySelector(`#playerRows .rating-row[data-num="${num}"]`);
  if(!row) return;
  row.querySelector('.pr-name').value = name;
  row.querySelector('.pr-tries').value = tries;
  row.querySelector('.pr-con').value = con;
  row.querySelector('.pr-pk').value = pk;
  row.querySelector('.pr-card').value = card;
  row.querySelector('.pr-pom').checked = pom;
  recalcRowPoints(row);
}

function currentRowNames(){
  return [...document.querySelectorAll('#playerRows .pr-name')].map(el=>el.value.trim().toLowerCase()).filter(Boolean);
}

function clearSquadTable(){
  document.querySelectorAll('#playerRows .rating-row').forEach(row=>{
    row.querySelector('.pr-name').value = '';
    row.querySelector('.pr-tries').value = 0;
    row.querySelector('.pr-con').value = 0;
    row.querySelector('.pr-pk').value = 0;
    row.querySelector('.pr-points').value = 0;
    row.querySelector('.pr-card').value = 'none';
    row.querySelector('.pr-pom').checked = false;
  });
}

function resetForm(){
  document.getElementById('mDate').value='';
  document.getElementById('mOpponent').value='';
  document.getElementById('mVenue').value='Home';
  document.getElementById('mComp').value='League';
  document.getElementById('mFor').value='';
  document.getElementById('mAgainst').value='';
  document.getElementById('mNotes').value='';
  clearSquadTable();
  editingId = null;
  document.getElementById('saveMatch').textContent='Save Match';
}

function collectForm(){
  const date = document.getElementById('mDate').value;
  const opponent = document.getElementById('mOpponent').value.trim();
  const venue = document.getElementById('mVenue').value;
  const comp = document.getElementById('mComp').value;
  const scoreFor = Number(document.getElementById('mFor').value||0);
  const scoreAgainst = Number(document.getElementById('mAgainst').value||0);
  const notes = document.getElementById('mNotes').value.trim();
  const rows = [...document.querySelectorAll('#playerRows .rating-row')];
  let playerRatings = rows.map(r=>{
    const tries = Number(r.querySelector('.pr-tries').value||0);
    const conversions = Number(r.querySelector('.pr-con').value||0);
    const pk = Number(r.querySelector('.pr-pk').value||0);
    return {
      player: r.querySelector('.pr-name').value.trim(),
      tries, conversions, pk,
      points: (tries*5) + (conversions*2) + (pk*3),
      card: r.querySelector('.pr-card').value,
      pom: r.querySelector('.pr-pom').checked
    };
  }).filter(p=>p.player);
  if(playerRatings.length && !playerRatings.some(p=>p.pom)){
    const scorers = playerRatings.filter(p=>p.points>0);
    if(scorers.length){
      const top = scorers.reduce((best,p)=>{
        if(p.points>best.points) return p;
        if(p.points===best.points && p.tries>best.tries) return p;
        return best;
      });
      playerRatings = playerRatings.map(p=>p===top?{...p,pom:true}:p);
    }
  }
  playerRatings.forEach(p=>addToRosterIfNew(p.player));
  return {date,opponent,venue,comp,scoreFor,scoreAgainst,notes,playerRatings};
}

async function saveMatch(){
  if(!document.getElementById('passcode').value){
    document.getElementById('saveStatus').textContent = 'Enter the passcode first.';
    return;
  }
  const data = collectForm();
  if(!data.date || !data.opponent){
    document.getElementById('saveStatus').textContent = 'Add a date and opponent first.';
    return;
  }
  const names = data.playerRatings.map(p=>p.player.toLowerCase());
  const dupes = names.filter((n,i)=>names.indexOf(n)!==i);
  if(dupes.length){
    document.getElementById('saveStatus').textContent = 'Same player picked twice — check the squad list.';
    return;
  }
  if(editingId){
    const idx = matches[currentTeam].findIndex(m=>m.id===editingId);
    if(idx>-1) matches[currentTeam][idx] = {...data, id:editingId};
  } else {
    matches[currentTeam].push({...data, id:uid()});
  }
  document.getElementById('saveStatus').textContent = 'Saving...';
  const ok = await persist();
  if(ok){
    document.getElementById('saveStatus').textContent = 'Saved.';
    setTimeout(()=>document.getElementById('saveStatus').textContent='',1800);
    resetForm();
    renderAll();
  }
}

function editMatch(id){
  const m = matches[currentTeam].find(x=>x.id===id);
  if(!m) return;
  document.getElementById('mDate').value=m.date;
  document.getElementById('mOpponent').value=m.opponent;
  document.getElementById('mVenue').value=m.venue;
  document.getElementById('mComp').value=m.comp;
  document.getElementById('mFor').value=m.scoreFor;
  document.getElementById('mAgainst').value=m.scoreAgainst;
  document.getElementById('mNotes').value=m.notes||'';
  clearSquadTable();
  m.playerRatings.forEach((p,i)=>setSquadRow(i+1, p.player, p.tries||0, p.conversions||0, p.pk||0, p.card, p.pom));
  editingId = id;
  document.getElementById('saveMatch').textContent='Update Match';
  window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteMatch(id){
  if(!document.getElementById('passcode').value){
    document.getElementById('saveStatus').textContent = 'Enter the passcode first.';
    return;
  }
  if(!confirm('Delete this match?')) return;
  matches[currentTeam] = matches[currentTeam].filter(m=>m.id!==id);
  const ok = await persist();
  if(ok) renderAll();
}

function renderMatchLog(){
  const list = [...matches[currentTeam]].sort((a,b)=>b.date.localeCompare(a.date));
  const container = document.getElementById('matchLog');
  if(list.length===0){ container.innerHTML = '<div class="empty">No matches logged for this team yet.</div>'; return; }
  container.innerHTML = list.map(m=>{
    const r = result(m);
    const dateStr = m.date ? new Date(m.date+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '';
    const ratingsRows = m.playerRatings.length ? m.playerRatings.map(p=>
      `<tr><td>${p.player}${p.pom?' <span class="pom-tag">POM</span>':''}${p.card&&p.card!=='none'?` <span class="card-badge ${p.card}" title="${p.card} card"></span>`:''}</td><td>${p.tries||0}</td><td>${p.conversions||0}</td><td>${p.pk||0}</td><td>${p.points||0}</td></tr>`
    ).join('') : '<tr><td colspan="5" class="empty">No player entries logged.</td></tr>';
    const pomPlayer = m.playerRatings.find(p=>p.pom);
    return `<div class="match">
      <div class="match-head" onclick="toggleMatch('${m.id}')">
        <div>
          <span class="res ${r}">${r}</span>
          <span class="match-title">${m.opponent}</span>
          <div class="match-sub">${dateStr} &middot; ${m.venue} &middot; ${m.comp}${pomPlayer?` &middot; <span class="pom-tag">POM ${pomPlayer.player}</span>`:''}</div>
        </div>
        <div class="match-score">${m.scoreFor} - ${m.scoreAgainst}</div>
      </div>
      <div class="match-body" id="body-${m.id}">
        ${m.notes ? `<div style="font-size:13px;color:var(--color-chalk-dim);margin-top:10px;">${m.notes}</div>` : ''}
        <table><thead><tr><th>Player</th><th>T</th><th>C</th><th>PK</th><th>Pts</th></tr></thead><tbody>${ratingsRows}</tbody></table>
        <div class="match-actions">
          <button class="ghost" onclick="editMatch('${m.id}')">Edit</button>
          <button class="ghost" onclick="deleteMatch('${m.id}')">Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
function toggleMatch(id){ document.getElementById('body-'+id).classList.toggle('open'); }

function renderAll(){
  renderMatchLog();
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTeam = btn.dataset.team;
    resetForm();
    renderAll();
  });
});
document.getElementById('saveMatch').addEventListener('click', saveMatch);

document.getElementById('addNewPlayerBtn').addEventListener('click', async ()=>{
  const input = document.getElementById('newPlayerName');
  const name = input.value.trim();
  if(!name) return;
  if(!document.getElementById('passcode').value){
    document.getElementById('saveStatus').textContent = 'Enter the passcode first.';
    return;
  }
  addToRosterIfNew(name);
  document.getElementById('saveStatus').textContent = 'Saving new player...';
  const ok = await persist();
  document.getElementById('saveStatus').textContent = ok ? 'Player added.' : document.getElementById('saveStatus').textContent;
  if(ok) setTimeout(()=>document.getElementById('saveStatus').textContent='',1800);
  input.value = '';
});

(async function init(){
  await loadData();
  resetForm();
  renderAll();
})();
</script>
</body>
</html>
